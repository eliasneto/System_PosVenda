# Ambiente local do Gerenciador Pós-Venda. Repositório independente do
# modulo-posVenda (ver ADR-001) - nenhum serviço aqui depende de nada
# daquele projeto em tempo de execução.
name: sistema_posvenda

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "3315:3306"
    volumes:
      - posvenda_db_data:/var/lib/mysql

  web:
    build: .
    restart: always
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_ENGINE=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GRAPH_FINANCEIRO_ENABLED=${GRAPH_FINANCEIRO_ENABLED}
      - GRAPH_FINANCEIRO_CLIENT_ID=${GRAPH_FINANCEIRO_CLIENT_ID}
      - GRAPH_FINANCEIRO_CLIENT_SECRET=${GRAPH_FINANCEIRO_CLIENT_SECRET}
      - GRAPH_FINANCEIRO_TENANT_ID=${GRAPH_FINANCEIRO_TENANT_ID}
      - GRAPH_FINANCEIRO_MAILBOX=${GRAPH_FINANCEIRO_MAILBOX}
      # FEAT-027 (RN-043/RN-044): autenticacao/sincronizacao via Active
      # Directory - so o container "web" faz login (email_scheduler nao).
      - USE_AD_AUTH=${USE_AD_AUTH}
      - AD_SERVER_URI=${AD_SERVER_URI}
      - AD_BIND_DN=${AD_BIND_DN}
      - AD_BIND_PASSWORD=${AD_BIND_PASSWORD}
      - AD_USER_SEARCH_BASE=${AD_USER_SEARCH_BASE}
      - AD_DEFAULT_DOMAIN=${AD_DEFAULT_DOMAIN}
    ports:
      - "8000:8000"
    volumes:
      # Codigo local montado por cima da imagem, para hot reload em dev
      # (o runserver detecta a mudanca e reinicia sozinho).
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  email_scheduler:
    # FEAT-009 (RF-08/RF-19): agendamento do polling da caixa do financeiro
    # via Microsoft Graph - o comando (`sincronizar_email_financeiro`) só
    # faz uma passada por chamada (ver apps/ri/services.py), então quem
    # repete no tempo é este container (mesma imagem do `web`, sem
    # dependência nova como Celery/cron do SO). Enquanto
    # GRAPH_FINANCEIRO_ENABLED=False (app do Azure AD ainda não
    # provisionado), o comando falha rápido e o loop só tenta de novo no
    # próximo ciclo - não derruba o container.
    build: .
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_ENGINE=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GRAPH_FINANCEIRO_ENABLED=${GRAPH_FINANCEIRO_ENABLED}
      - GRAPH_FINANCEIRO_CLIENT_ID=${GRAPH_FINANCEIRO_CLIENT_ID}
      - GRAPH_FINANCEIRO_CLIENT_SECRET=${GRAPH_FINANCEIRO_CLIENT_SECRET}
      - GRAPH_FINANCEIRO_TENANT_ID=${GRAPH_FINANCEIRO_TENANT_ID}
      - GRAPH_FINANCEIRO_MAILBOX=${GRAPH_FINANCEIRO_MAILBOX}
    volumes:
      - .:/app
    command: >
      sh -c "sleep 15 && while true; do
               python manage.py sincronizar_email_financeiro || true;
               sleep ${GRAPH_FINANCEIRO_POLL_INTERVAL_SECONDS:-300};
             done"
    depends_on:
      - db

  rpa_eace_worker:
    # FEAT-033 (RN-058) + ADR-009 (2026-11-10): supervisor dos robôs do RPA
    # EACE - `supervisionar_robos_rpa_eace` sobe 1 processo por robô ativo
    # do admin ("Robôs do RPA EACE"), cada um rodando
    # `processar_fila_rpa_eace --robo <id>` em loop, com navegador e login
    # próprios, em paralelo na mesma fila (nunca 2 robôs no mesmo INEP).
    # Sem robô ativo, 1 robô com o login do .env (EACE_USUARIO/EACE_SENHA).
    # O paralelismo é configurado no admin - não use "--scale
    # rpa_eace_worker=2" (2 supervisores tomariam os envios um do outro
    # como órfãos).
    build: .
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_ENGINE=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - EACE_URL=${EACE_URL}
      - EACE_USUARIO=${EACE_USUARIO}
      - EACE_SENHA=${EACE_SENHA}
      # EACE_HEADLESS/EACE_TIMEOUT_MS/EACE_DELAY_MS ficam de fora de
      # propósito - se não estiverem no .env, o compose passaria string
      # vazia (nunca "variável ausente") e isso pisaria no default real
      # de apps/integracoes/eace/config.py (ex.: EACE_HEADLESS viraria
      # False, abrindo navegador visível, em vez de True). Só declarar
      # aqui se o .env realmente definir um valor não vazio para os 3.
    volumes:
      # Mesmo bind mount do "web" - precisa enxergar os mesmos arquivos de
      # Documento (media/) que o "web" grava.
      - .:/app
    command: >
      sh -c "sleep 15 && exec python manage.py supervisionar_robos_rpa_eace
               --intervalo ${RPA_EACE_POLL_INTERVAL_SECONDS:-5}
               --max-robos ${RPA_EACE_MAX_ROBOS:-3}"
    depends_on:
      - db

  ixc_worker:
    # FEAT-053 (ADR-007, emenda 2026-09-23): processo consumidor unico das
    # Automacoes IXC - `processar_fila_automacoes_ixc` so faz 1 chunk por
    # chamada (apps/ixc/services.py), quem repete no tempo e este
    # container (mesma imagem do "web", sem dependencia nova). Substitui o
    # encadeamento HTMX como motor de verdade do processamento - a tela so
    # mostra o status (polling so leitura, `ixc_status`), quem processa de
    # verdade e este worker, mesmo com ninguem olhando a tela (RN a
    # formalizar - caso real: execucao ficava parada para sempre em 0% se
    # a aba fechasse antes de terminar).
    build: .
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_ENGINE=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - IXC_URL=${IXC_URL}
      - IXC_TOKEN=${IXC_TOKEN}
      - IXC_SSL_VERIFY=${IXC_SSL_VERIFY}
      - IXC_TIMEOUT=${IXC_TIMEOUT}
    volumes:
      - .:/app
    command: >
      sh -c "sleep 15 && while true; do
               python manage.py processar_fila_automacoes_ixc || true;
               sleep ${IXC_WORKER_POLL_INTERVAL_SECONDS:-3};
             done"
    depends_on:
      - db

volumes:
  # Mesmo nome já usado pelo checkout anterior (sistema_posvenda_posvenda_db_data) -
  # sobe reaproveitando o dado que já existe, sem recriar do zero.
  posvenda_db_data:
