# Nginx do ambiente de homologacao (FEAT-012) - serve /static e /media
# direto dos volumes nomeados (mesmo caminho de STATIC_ROOT/MEDIA_ROOT do
# settings.py, sem alterar nada la) e repassa o resto para o Gunicorn
# (servico "web", porta 8000, so acessivel dentro da rede do compose).
#
# TODO: trocar "server_name _;" pelo dominio real de homologacao quando
# definido, e ativar HTTPS (certificado + redirect 80->443) nesse momento
# - fora do escopo desta entrega inicial (sem dominio/certificado
# informado ainda).

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;  # upload da Planilha EACE (FEAT-023/RN-021)

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
