<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EACE RPA Portal</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b22;
      --surface-2: #1c2128;
      --border: #30363d;
      --primary: #388bfd;
      --primary-hover: #58a6ff;
      --success: #3fb950;
      --error: #f85149;
      --warning: #d29922;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-dim: #484f58;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 36px;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .logo-icon { color: var(--primary); font-size: 18px; }

    nav { display: flex; gap: 2px; }
    nav button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s, background 0.15s;
    }
    nav button:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    nav button.active { color: var(--primary); background: rgba(56,139,253,0.12); }

    /* ── Content ── */
    main { padding: 28px 24px; max-width: 900px; margin: 0 auto; }

    .tab { display: none; }
    .tab.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Forms ── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    input[type=text],
    input[type=password],
    input[type=email],
    input[type=url],
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input:focus, textarea:focus { border-color: var(--primary); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 60px; }
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 2px 4px;
    }
    .pw-toggle:hover { color: var(--text); }

    textarea {
      min-height: 110px;
      resize: vertical;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      transition: background 0.15s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-danger {
      background: rgba(248,81,73,0.12);
      color: var(--error);
      border: 1px solid rgba(248,81,73,0.25);
    }
    .btn-danger:hover { background: rgba(248,81,73,0.22); }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-lg { padding: 13px 36px; font-size: 15px; font-weight: 600; }

    .form-footer { display: flex; justify-content: flex-end; margin-top: 20px; gap: 10px; }

    /* ── INEP tree ── */
    .inep-add { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .inep-add input { max-width: 240px; }

    .inep-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .inep-header {
      background: var(--surface-2);
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .inep-name {
      font-weight: 600;
      font-size: 13px;
      color: #e6edf3;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inep-body { padding: 14px 16px; }

    .tipo-section { margin-bottom: 14px; }
    .tipo-section:last-child { margin-bottom: 0; }

    .tipo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tipo-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
    }

    .file-list { list-style: none; }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .file-item:hover { background: rgba(255,255,255,0.04); }
    .file-name {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ext-pdf { color: #f97316; }
    .ext-xml { color: #a78bfa; }

    .file-empty {
      color: var(--text-dim);
      font-size: 12px;
      padding: 3px 6px;
      font-style: italic;
    }

    .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    /* hidden file input inside label */
    .upload-trigger { cursor: pointer; }
    .upload-trigger input[type=file] { display: none; }

    /* ── Execute tab ── */
    .exec-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .s-idle { background: rgba(72,79,88,0.25); color: var(--text-dim); }
    .s-idle .dot { background: var(--text-dim); }

    .s-running { background: rgba(210,153,34,0.15); color: var(--warning); }
    .s-running .dot { background: var(--warning); animation: pulse 1s ease-in-out infinite; }

    .s-done { background: rgba(63,185,80,0.15); color: var(--success); }
    .s-done .dot { background: var(--success); }

    .s-error { background: rgba(248,81,73,0.15); color: var(--error); }
    .s-error .dot { background: var(--error); }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ── Terminal ── */
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .terminal {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.65;
      height: 440px;
      overflow-y: auto;
      padding: 14px 16px;
      scroll-behavior: smooth;
    }

    .log-line { display: block; white-space: pre-wrap; word-break: break-all; }
    .log-system  { color: #58a6ff; }
    .log-error   { color: #f85149; }
    .log-warning { color: #d29922; }
    .log-success { color: #3fb950; }
    .log-info    { color: #a8ff78; }
    .log-dim     { color: #484f58; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      z-index: 9999;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 340px;
    }
    #toast.show { display: block; animation: fadeUp 0.2s ease; }
    #toast.t-ok  { border-color: rgba(63,185,80,0.4); color: var(--success); }
    #toast.t-err { border-color: rgba(248,81,73,0.4); color: var(--error); }
    @keyframes fadeUp {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">▶</span>
    EACE RPA Portal
  </div>
  <nav>
    <button id="nav-config"   class="active" onclick="showTab('config',   this)">⚙ Configurações</button>
    <button id="nav-files"              onclick="showTab('files',    this)">📁 Arquivos</button>
    <button id="nav-execute"            onclick="showTab('execute',  this)">▶ Executar</button>
  </nav>
</header>

<main>

  <!-- ═══ CONFIGURAÇÕES ═══════════════════════════════════════════════════ -->
  <div id="tab-config" class="tab active">
    <div class="card">
      <div class="card-title">⚙ Credenciais do Portal EACE</div>

      <div class="form-group">
        <label>URL do portal</label>
        <input type="url" id="cfg-url" placeholder="https://eace.org.br/login?login=login">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>E-mail de acesso</label>
          <input type="email" id="cfg-usuario" placeholder="usuario@exemplo.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <div class="pw-wrap">
            <input type="password" id="cfg-senha" placeholder="••••••••">
            <button class="pw-toggle" onclick="togglePw('cfg-senha', this)">mostrar</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Timeout (ms)</label>
          <input type="text" id="cfg-timeout" placeholder="30000">
        </div>
        <div class="form-group">
          <label>Delay entre ações (ms)</label>
          <input type="text" id="cfg-delay" placeholder="1500">
        </div>
      </div>

      <div class="form-footer">
        <button class="btn btn-primary" onclick="saveConfig()">Salvar configurações</button>
      </div>
    </div>
  </div>

  <!-- ═══ ARQUIVOS ════════════════════════════════════════════════════════ -->
  <div id="tab-files" class="tab">

    <div class="card">
      <div class="card-title">📋 OSPs para processar</div>
      <div class="form-group">
        <label>Um número de OSP por linha</label>
        <textarea id="osp-txt" placeholder="2939&#10;3929&#10;4521"></textarea>
      </div>
      <div class="form-footer">
        <button class="btn btn-primary" onclick="saveOsp()">Salvar OSPs</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📂 Notas Fiscais por INEP</div>

      <div class="inep-add">
        <input type="text" id="new-inep" placeholder="Número do INEP (ex: 35083938)" maxlength="10"
               onkeydown="if(event.key==='Enter') addInep()">
        <button class="btn btn-primary" onclick="addInep()">+ Adicionar INEP</button>
      </div>

      <div id="inep-tree">
        <div class="file-empty">Nenhum INEP cadastrado. Adicione um acima.</div>
      </div>
    </div>
  </div>

  <!-- ═══ EXECUTAR ════════════════════════════════════════════════════════ -->
  <div id="tab-execute" class="tab">
    <div class="card">
      <div class="card-title">▶ Controle de execução</div>
      <div class="exec-top">
        <div id="status-badge" class="status-badge s-idle">
          <span class="dot"></span>
          <span id="status-txt">Aguardando</span>
        </div>
        <button id="btn-run" class="btn btn-primary btn-lg" onclick="startExec()">
          ▶ Executar RPA
        </button>
      </div>
    </div>

    <div class="card">
      <div class="terminal-header">
        <div class="card-title" style="margin:0;border:none;padding:0">📟 Logs em tempo real</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="toggleAutoScroll(this)">Auto-scroll: ON</button>
          <button class="btn btn-ghost btn-sm" onclick="clearLogs()">Limpar</button>
        </div>
      </div>
      <div class="terminal" id="terminal">
        <span class="log-line log-dim">Aguardando execução...</span>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
// ────────────────────────────────────────────────────────────────────────────
// Utils
// ────────────────────────────────────────────────────────────────────────────

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Erro desconhecido');
  }
  return res.json();
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show t-${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3600);
}

function togglePw(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? 'mostrar' : 'ocultar';
}

// ────────────────────────────────────────────────────────────────────────────
// Tabs
// ────────────────────────────────────────────────────────────────────────────

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  btn.classList.add('active');
  if (name === 'config') loadConfig();
  if (name === 'files')  loadFiles();
  if (name === 'execute') checkRunning();
}

// ────────────────────────────────────────────────────────────────────────────
// Config
// ────────────────────────────────────────────────────────────────────────────

async function loadConfig() {
  try {
    const c = await api('GET', '/api/config');
    document.getElementById('cfg-url').value     = c.eace_url      || '';
    document.getElementById('cfg-usuario').value = c.eace_usuario  || '';
    document.getElementById('cfg-senha').value   = c.eace_senha    || '';
    document.getElementById('cfg-timeout').value = c.timeout_ms    || '30000';
    document.getElementById('cfg-delay').value   = c.delay_ms      || '1500';
  } catch (e) { toast('Erro ao carregar configurações: ' + e.message, 'err'); }
}

async function saveConfig() {
  try {
    await api('PUT', '/api/config', {
      eace_url:    document.getElementById('cfg-url').value,
      eace_usuario:document.getElementById('cfg-usuario').value,
      eace_senha:  document.getElementById('cfg-senha').value,
      timeout_ms:  document.getElementById('cfg-timeout').value,
      delay_ms:    document.getElementById('cfg-delay').value,
    });
    toast('Configurações salvas!');
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}

// ────────────────────────────────────────────────────────────────────────────
// OSP
// ────────────────────────────────────────────────────────────────────────────

async function loadOsp() {
  const { content } = await api('GET', '/api/osp');
  document.getElementById('osp-txt').value = content;
}

async function saveOsp() {
  try {
    await api('PUT', '/api/osp', { content: document.getElementById('osp-txt').value });
    toast('OSPs salvos!');
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}

// ────────────────────────────────────────────────────────────────────────────
// Files
// ────────────────────────────────────────────────────────────────────────────

async function loadFiles() {
  await loadOsp().catch(() => {});
  try {
    const { tree } = await api('GET', '/api/files');
    renderTree(tree);
  } catch (e) { toast('Erro ao carregar arquivos: ' + e.message, 'err'); }
}

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (ext === 'pdf') return '<span class="ext-pdf">PDF</span>';
  if (ext === 'xml') return '<span class="ext-xml">XML</span>';
  return '';
}

function renderTree(tree) {
  const el = document.getElementById('inep-tree');
  if (!tree.length) {
    el.innerHTML = '<div class="file-empty">Nenhum INEP cadastrado. Adicione um acima.</div>';
    return;
  }
  el.innerHTML = tree.map(({ inep, tipos }) => `
    <div class="inep-item">
      <div class="inep-header">
        <div class="inep-name">📁 ${inep}</div>
        <button class="btn btn-danger btn-sm" onclick="deleteInep('${inep}')">🗑 Remover</button>
      </div>
      <div class="inep-body">
        ${['KIT','NOBREAK'].map((tipo, i) => `
          ${i > 0 ? '<div class="divider"></div>' : ''}
          <div class="tipo-section">
            <div class="tipo-header">
              <span class="tipo-label">📂 ${tipo}</span>
              <label class="btn btn-ghost btn-sm upload-trigger">
                ↑ Enviar arquivos
                <input type="file" multiple accept=".pdf,.xml"
                  onchange="uploadFiles('${inep}','${tipo}',this.files,this)">
              </label>
            </div>
            <ul class="file-list">
              ${tipos[tipo].length === 0
                ? '<li class="file-empty">Nenhum arquivo</li>'
                : tipos[tipo].map(f => `
                    <li class="file-item">
                      <span class="file-name">${fileIcon(f)} ${f}</span>
                      <button class="btn btn-danger btn-sm"
                        onclick="deleteFile('${inep}','${tipo}','${f}')">×</button>
                    </li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

async function addInep() {
  const inp = document.getElementById('new-inep');
  const inep = inp.value.trim();
  if (!inep) return;
  if (!/^\d+$/.test(inep)) { toast('INEP deve conter apenas números', 'err'); return; }
  try {
    await api('POST', `/api/files/inep/${inep}`);
    inp.value = '';
    await loadFiles();
    toast(`INEP ${inep} criado!`);
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}

async function deleteInep(inep) {
  if (!confirm(`Remover INEP ${inep} e todos os seus arquivos?`)) return;
  try {
    await api('DELETE', `/api/files/inep/${inep}`);
    await loadFiles();
    toast(`INEP ${inep} removido.`);
  } catch (e) { toast('Erro: ' + e.message, 'err'); }
}

async function uploadFiles(inep, tipo, fileList, input) {
  if (!fileList.length) return;
  const fd = new FormData();
  for (const f of fileList) fd.append('files', f);
  try {
    const res = await fetch(`/api/files/upload/${inep}/${tipo}`, { method: 'POST', body: fd });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Erro no upload');
    }
    const { uploaded } = await res.json();
    await loadFiles();
    toast(`${uploaded.length} arquivo(s) enviado(s)!`);
  } catch (e) {
    toast('Erro no upload: ' + e.message, 'err');
  } finally {
    input.value = '';
  }
}

async function deleteFile(inep, tipo, filename) {
  try {
    await api('DELETE', `/api/files/${inep}/${tipo}/${encodeURIComponent(filename)}`);
    await loadFiles();
  } catch (e) { toast('Erro ao remover: ' + e.message, 'err'); }
}

// ────────────────────────────────────────────────────────────────────────────
// Execution & Logs
// ────────────────────────────────────────────────────────────────────────────

let _sse = null;
let _autoScroll = true;
let _pollTimer = null;

function setStatus(state) {
  const badge = document.getElementById('status-badge');
  const txt   = document.getElementById('status-txt');
  const btn   = document.getElementById('btn-run');

  badge.className = `status-badge s-${state}`;
  txt.textContent = { idle:'Aguardando', running:'Executando...', done:'Concluído', error:'Erro' }[state] || state;

  btn.disabled    = state === 'running';
  btn.textContent = state === 'running' ? '⏳ Executando...' : '▶ Executar RPA';
}

function toggleAutoScroll(btn) {
  _autoScroll = !_autoScroll;
  btn.textContent = `Auto-scroll: ${_autoScroll ? 'ON' : 'OFF'}`;
  if (_autoScroll) {
    const t = document.getElementById('terminal');
    t.scrollTop = t.scrollHeight;
  }
}

function clearLogs() {
  document.getElementById('terminal').innerHTML =
    '<span class="log-line log-dim">Logs limpos.</span>';
}

function appendLog(line) {
  const term = document.getElementById('terminal');
  const placeholder = term.querySelector('.log-dim');
  if (placeholder && (placeholder.textContent === 'Aguardando execução...' ||
                      placeholder.textContent === 'Logs limpos.')) {
    placeholder.remove();
  }

  const span = document.createElement('span');
  span.className = 'log-line';
  const low = line.toLowerCase();
  if (line.startsWith('>>>'))                                       span.classList.add('log-system');
  else if (low.includes('error') || low.includes('erro') ||
           low.includes('exception') || low.includes('falhou'))    span.classList.add('log-error');
  else if (low.includes('warn') || low.includes('aviso'))          span.classList.add('log-warning');
  else if (low.includes('sucesso') || low.includes('success') ||
           low.includes('concluíd') || low.includes('enviado'))    span.classList.add('log-success');
  else                                                              span.classList.add('log-info');

  span.textContent = line;
  term.appendChild(span);

  if (_autoScroll) term.scrollTop = term.scrollHeight;
}

function connectSSE() {
  if (_sse) { _sse.close(); _sse = null; }

  _sse = new EventSource('/api/logs/stream');

  _sse.onmessage = e => appendLog(JSON.parse(e.data));

  _sse.addEventListener('end', () => {
    _sse.close(); _sse = null;
  });

  _sse.onerror = () => {
    _sse.close(); _sse = null;
  };
}

function startStatusPoll() {
  clearInterval(_pollTimer);
  _pollTimer = setInterval(async () => {
    try {
      const { running } = await api('GET', '/api/execute/status');
      if (!running) {
        clearInterval(_pollTimer);
        setStatus('done');
      }
    } catch (_) {}
  }, 3000);
}

async function startExec() {
  try {
    await api('POST', '/api/execute');
    setStatus('running');
    clearLogs();
    connectSSE();
    startStatusPoll();
  } catch (e) {
    if (e.message.includes('andamento')) {
      toast('Já existe uma execução em andamento.', 'err');
      setStatus('running');
      connectSSE();
      startStatusPoll();
    } else {
      toast('Erro ao iniciar: ' + e.message, 'err');
      setStatus('error');
    }
  }
}

async function checkRunning() {
  try {
    const { running } = await api('GET', '/api/execute/status');
    if (running) {
      setStatus('running');
      connectSSE();
      startStatusPoll();
    }
  } catch (_) {}
}

// ────────────────────────────────────────────────────────────────────────────
// Init
// ────────────────────────────────────────────────────────────────────────────

document.getElementById('terminal').addEventListener('wheel', () => {
  const t = document.getElementById('terminal');
  const atBottom = t.scrollTop + t.clientHeight >= t.scrollHeight - 60;
  if (!atBottom && _autoScroll) {
    _autoScroll = false;
    const btn = document.querySelector('[onclick="toggleAutoScroll(this)"]');
    if (btn) btn.textContent = 'Auto-scroll: OFF';
  }
});

loadConfig();
</script>
