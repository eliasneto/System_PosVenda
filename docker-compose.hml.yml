# Ambiente de homologacao do Gerenciador Pos-Venda (FEAT-012).
#
# Diferenca central para o docker-compose.yml local: aqui o servico "web"
# sobe com o Gunicorn do proprio Dockerfile (nao com runserver) - Gunicorn
# sozinho nao serve arquivo estatico, entao o servico "nginx" fica na
# frente dele servindo /static e /media direto dos volumes nomeados
# (populados por "collectstatic", rodado pelo scripts/deploy_homolog.sh) e
# repassando o resto para o Gunicorn. Nenhuma configuracao de aplicacao
# (settings.py) foi alterada para isso - fora do escopo do DevOps
# (.claude/agents/devops.md); WhiteNoise, que exigiria essa alteracao, foi
# descartado em favor do Nginx por esse motivo (mesma decisao ja registrada
# no checklist, FEAT-012).
#
# Uso: docker compose -f docker-compose.hml.yml --env-file .env.hml up -d --build
name: sistema_posvenda_hml

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - posvenda_db_data_hml:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Porta diferente da usada no ambiente local (3315), publicada só no
    # loopback do próprio servidor (127.0.0.1:3316) - nunca na interface
    # externa, mesmo que o firewall do host esteja mal configurado (o
    # default sempre ativo é proposital: só ouvir em loopback não amplia
    # superfície de ataque, então não depende de configurar variável
    # nenhuma para ficar seguro). Uso pretendido: acesso de diagnóstico/
    # consulta (ex.: usuário de banco só leitura para terceiro) via túnel
    # SSH - ver `docs/devops/DEPLOYMENT.md`, "Acesso de consulta para
    # terceiro (só leitura)".
    ports:
      - "127.0.0.1:${HML_DB_DIAGNOSTICO_PORT:-3316}:3306"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.hml
    environment:
      - DB_ENGINE=mysql
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      # Codigo da imagem buildada (sem bind mount do host - homologacao
      # roda a partir do commit publicado, nao do checkout local).
      - staticfiles_hml:/app/staticfiles
      - media_hml:/app/media
    depends_on:
      db:
        condition: service_healthy
    # CMD padrao do Dockerfile (gunicorn). Migration e collectstatic ficam
    # no scripts/deploy_homolog.sh (etapa explicita do pipeline), nao aqui,
    # para nao rodar a cada "docker compose up" sem necessidade.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/homolog.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_hml:/app/staticfiles:ro
      - media_hml:/app/media:ro
    ports:
      - "${HML_HTTP_PORT:-8010}:80"
    depends_on:
      - web

  email_scheduler:
    # Mesmo papel do container local (docker-compose.yml) - roda o polling
    # do financeiro (RF-08/RF-19) em loop. Replicado aqui conforme
    # pendencia registrada no checklist (FEAT-012, 2026-08-25).
    build: .
    restart: unless-stopped
    env_file:
      - .env.hml
    environment:
      - DB_ENGINE=mysql
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 15 && while true; do
               python manage.py sincronizar_email_financeiro || true;
               sleep ${GRAPH_FINANCEIRO_POLL_INTERVAL_SECONDS:-300};
             done"

  rpa_eace_worker:
    # FEAT-033 (Fase 3, RN-058/ADR-005): mesmo papel do container local -
    # processo consumidor unico da fila do RPA EACE. RN-058 exige no
    # maximo 1 execucao por vez em todo o sistema - manter só 1 réplica
    # deste serviço, aqui e no ambiente local.
    build: .
    restart: unless-stopped
    env_file:
      - .env.hml
    environment:
      - DB_ENGINE=mysql
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      # Mesmo volume nomeado do "web" - precisa enxergar os mesmos
      # arquivos de Documento (PDF/XML) que o "web" grava em media_hml.
      - media_hml:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 15 && while true; do
               python manage.py processar_fila_rpa_eace || true;
               sleep ${RPA_EACE_POLL_INTERVAL_SECONDS:-5};
             done"

volumes:
  posvenda_db_data_hml:
  staticfiles_hml:
  media_hml:
