{% load l10n %}{# Faturamento complementar (v1.6.0): 1 linha de item — KIT/produto do catálogo (preço do catálogo, só exibido) + quantidade + Num OSP. #}
<div class="flex flex-wrap sm:flex-nowrap items-end gap-2 bg-gray-50 dark:bg-gray-800 rounded-xl p-3" data-complementar-linha>
    <label class="flex-1 min-w-[12rem] flex flex-col gap-1 text-[10px] font-black uppercase text-gray-500 dark:text-gray-400">
        KIT / produto
        <select name="item_produto" required data-complementar-produto
                class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-bold text-gray-800 dark:text-gray-100 normal-case">
            <option value="">Selecione</option>
            {% for kit in complementar_catalogo %}
            <option value="{{ kit.pk }}" data-valor="{{ kit.valor_faturavel|unlocalize }}"{% if item and item.kit_padrao_id == kit.pk %} selected{% endif %}>{{ kit.rotulo_complementar }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="w-20 flex flex-col gap-1 text-[10px] font-black uppercase text-gray-500 dark:text-gray-400">
        Qtd.
        <input type="number" name="item_quantidade" min="1" required value="{% if item %}{{ item.quantidade }}{% else %}1{% endif %}" data-complementar-quantidade
               class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-bold text-gray-800 dark:text-gray-100">
    </label>
    <label class="w-36 flex flex-col gap-1 text-[10px] font-black uppercase text-gray-500 dark:text-gray-400">
        Num OSP
        {% if complementar_osps %}
        <select name="item_osp" {% if complementar_osps|length > 1 %}required{% endif %}
                class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-xs font-bold text-gray-800 dark:text-gray-100">
            {% if complementar_osps|length > 1 %}<option value="">Selecione</option>{% endif %}
            {% for osp in complementar_osps %}<option value="{{ osp }}"{% if item and item.num_osp == osp %} selected{% endif %}>{{ osp }}</option>{% endfor %}
        </select>
        {% else %}
        <input type="hidden" name="item_osp" value="">
        <span class="px-3 py-2 text-xs font-bold text-gray-400 normal-case">Sem OSP no RI</span>
        {% endif %}
    </label>
    <div class="w-32 text-right text-[11px] font-bold text-gray-600 dark:text-gray-300 pb-2">
        <span class="block text-[10px] text-gray-400 dark:text-gray-500 normal-case" data-complementar-unitario>—</span>
        <span data-complementar-subtotal>—</span>
    </div>
    <button type="button" data-complementar-remover class="pb-2 text-gray-400 hover:text-red-500" title="Remover item" aria-label="Remover item">
        <i data-lucide="x" class="w-4 h-4"></i>
    </button>
</div>
