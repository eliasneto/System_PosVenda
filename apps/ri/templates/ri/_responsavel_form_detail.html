{% comment %}
Card "Responsável" do cabeçalho da tela do RI (FEAT-004). FEAT-019:
mesmo padrão do `_responsavel_form_grid.html`, com o `origem=detail`
dizendo à view qual dos dois formulários (grid ou detalhe) deve ser
reposto na resposta HTMX.
{% endcomment %}
<div class="bg-pv-black px-6 py-3 rounded-2xl shadow-lg text-white" id="card-responsavel-{{ ri.pk }}" hx-swap-oob="true">
    <p class="text-[10px] font-black text-gray-500 uppercase leading-none mb-1">Responsável</p>
    <form method="POST" action="{% url 'ri_responsavel_update' pk=ri.pk %}"
          hx-post="{% url 'ri_responsavel_update' pk=ri.pk %}" hx-swap="none"
          data-salvar-ao-trocar>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        <input type="hidden" name="origem" value="detail">
        <select name="responsavel" class="bg-transparent border-none outline-none text-sm font-black italic text-pv-yellow cursor-pointer">
            {% if not ri.responsavel %}
            <option value="" selected>Não atribuído</option>
            {% endif %}
            {% for usuario in usuarios %}
            <option value="{{ usuario.pk }}" {% if ri.responsavel_id == usuario.pk %}selected{% endif %}>{{ usuario.get_full_name|default:usuario.username }}</option>
            {% endfor %}
        </select>
    </form>
</div>
